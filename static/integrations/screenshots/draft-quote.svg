<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" fill="none">
  <rect width="1200" height="750" fill="#eae9f3"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="64" y="66" fill="#6c658b" font-size="15" font-weight="600" letter-spacing="2">DINU + HUBSPOT QUOTES</text>
    <text x="64" y="123" fill="#403954" font-size="38" font-weight="600">From agreed terms to a draft quote.</text>
    <text x="64" y="160" fill="#7c7593" font-size="20">Bring your contract into HubSpot and finish the details there.</text>
    <rect x="1010" y="44" width="126" height="32" rx="16" fill="#dddaea"/>
    <text x="1073" y="65" text-anchor="middle" fill="#7c7593" font-size="13">Sample screen</text>
    <rect x="64" y="205" width="1072" height="480" rx="16" fill="#fff" stroke="#dad7e4"/>
    <path d="M64 265H1136" stroke="#e6eaed"/>
    <text x="92" y="243" fill="#ff7a59" font-size="22" font-weight="600">HubSpot</text>
    <text x="237" y="241" fill="#677888" font-size="14">Commerce / Quotes</text>
    <rect x="1017" y="221" width="88" height="29" rx="6" fill="#f0eef7"/>
    <text x="1061" y="241" text-anchor="middle" fill="#7c7593" font-size="12">Draft</text>
    <text x="104" y="312" fill="#33475b" font-size="24" font-weight="600">Acme · Annual agreement</text>
    <text x="104" y="342" fill="#738493" font-size="14">Complete your quote before sharing it with the buyer.</text>
    <rect x="104" y="371" width="248" height="264" rx="9" fill="#f7f9fb"/>
    <text x="126" y="408" fill="#677888" font-size="14">1   Quote details</text>
    <text x="126" y="455" fill="#677888" font-size="14">2   Buyer information</text>
    <text x="126" y="502" fill="#677888" font-size="14">3   Line items</text>
    <rect x="114" y="521" width="228" height="41" rx="6" fill="#e9e5f2"/>
    <text x="126" y="547" fill="#655a82" font-size="14" font-weight="600">4   Terms</text>
    <text x="126" y="596" fill="#677888" font-size="14">5   Signature and payment</text>
    <text x="390" y="395" fill="#33475b" font-size="20" font-weight="600">Terms</text>
    <text x="390" y="423" fill="#738493" font-size="14">Your saved contract, including approved concessions.</text>
    <rect x="390" y="444" width="706" height="191" rx="8" fill="#fff" stroke="#dce2e8"/>
    <path d="M390 480H1096" stroke="#e6eaed"/>
    <text x="408" y="468" fill="#677888" font-size="14" font-weight="600">B</text>
    <text x="440" y="468" fill="#677888" font-size="14" font-style="italic">I</text>
    <text x="475" y="468" fill="#677888" font-size="13">Heading ▾</text>
    <text x="413" y="515" fill="#33475b" font-size="17" font-weight="600">Master Services Agreement</text>
    <text x="413" y="548" fill="#677888" font-size="13">This agreement is entered into by Acme and Northstar.</text>
    <text x="413" y="583" fill="#33475b" font-size="14" font-weight="600">1. Services</text>
    <text x="413" y="609" fill="#677888" font-size="13">The parties agree to the services and terms set out below.</text>
  </g>
</svg>
